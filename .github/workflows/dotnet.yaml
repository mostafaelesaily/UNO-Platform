name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  CI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Uno/Uno.slnx

      - name: Build
        run: dotnet build Uno/Uno.slnx --no-restore

      - name: Test
        run: dotnet test Uno/Uno.slnx --no-build --verbosity normal